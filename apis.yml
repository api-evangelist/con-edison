apis:
- aid: con-edison:con-edison-hosting-capacity-map-rest-api
  name: Con Edison Hosting Capacity Map REST API
  description: >-
    Con Edison's distribution-grid open data, published as anonymously readable Esri ArcGIS REST feature
    services behind the public Hosting Capacity Map. Con Edison's own documentation states that "REST
    API access allows users to overlay the Con Edison Hosting Capacity Map data with their own GIS systems
    and mapping tools" and that the endpoints are exposed on the map's "Rest API" tab. The services cover
    CECONY and Orange & Rockland segmented and network hosting capacity for distributed generation, EV
    load-serving transformer capacity, 33kV feeders, non-wires-solutions impacted networks, Locational
    System Relief Value eligibility, disadvantaged and overburdened communities, and the IEDR-facing hosting
    capacity layers. No login, API key, or agreement is required; every service probed returned HTTP 200
    unauthenticated. Con Edison states the data "is being provided for informational purposes only and
    is not intended to be a substitute for the established interconnection application process."
  humanURL: https://www.coned.com/en/business-partners/hosting-capacity
  baseURL: https://services.arcgis.com/ciPnsNFi1JLWVjva/arcgis/rest/services
