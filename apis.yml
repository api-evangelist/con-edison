apis:
- aid: con-edison:con-edison-green-button-connect-my-data-api
  name: Con Edison Green Button Connect My Data API
  description: >-
    Con Edison and Orange & Rockland's Green Button Connect My Data (CMD)
    implementation, branded "Share My Data" — the NAESB REQ.21 Energy Services
    Provider Interface (ESPI) machine-to-machine API through which a customer-
    authorized third party retrieves that customer's electric and gas interval
    usage, usage summaries, billing information and retail customer records in
    Atom/ESPI XML. The published Swagger 2.0 definition ("DCX GBC API V2",
    basePath /gbc/espi/1_1) documents 37 paths across ApplicationInformation,
    Authorization, ReadServiceStatus, UsagePoint, MeterReading, IntervalBlock,
    ReadingType, LocalTimeParameters, UsageSummary, RetailCustomer, Batch and
    RealTime resources. Authorization is OAuth 2.0 (RFC 6749/6750): the
    customer consents on the Con Edison or ORU site, the third party exchanges
    the authorization code at the token endpoint, and access tokens live one
    hour. Scopes are ESPI functional blocks (FB=1_3_4_5_7_8_10_15_16_51_53_56_
    57_58_60 with IntervalDuration, BlockDuration and HistoryLength
    qualifiers). Up to two years of history; 5-minute intervals for commercial
    AMI electric, 15-minute for residential AMI electric, 1-hour for gas AMI,
    monthly for non-interval meters; real-time electric readings for the last
    24 hours at 45-minute latency. Access is NOT self-serve — registration, a
    signed Data Security Agreement, a technical onboarding form and supervised
    test-environment certification are required before production credentials
    are issued.
  humanURL: https://www.coned.com/en/accounts-billing/share-energy-usage-data/become-a-third-party
  baseURL: https://api.coned.com/gbc/espi/1_1
