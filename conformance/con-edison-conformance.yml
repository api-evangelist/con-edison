note: >-
  Conformance claims below are either cited by Con Edison in its own Document References table
  (section 6 of the onboarding document) or derived from the published contract and live probes.
  Green Button Alliance CERTIFICATION could not be confirmed from a primary GBA source: the GBA
  publishes no certified-implementation directory (/certified and /certified-products both 404 on
  2026-07-27) and Con Edison appears on greenbuttonalliance.org only as a sponsor member. The Postman
  collection Con Edison publishes is titled "GBC Certification Third party V3.3", which is strong
  circumstantial evidence that it runs the GBA certification suite — but it is Con Edison's artifact,
  not a GBA register entry, so certification is recorded as unverified rather than true.
