regulatory_context:
  regime: green-button-voluntary under New York State PSC supervision
  instruments:
  - NY PSC Case 16-M-0411 — Joint Utilities Supplemental DSIP; Con Edison committed to implement phase one of Green Button Connect by end of 2017
  - NY PSC Case 20-M-0082 — Order Adopting a Data Access Framework (April 15, 2021)
  - Customer Data Access Tariff and the Share My Data Customer Data Privacy and Protection Rules, cited in Con Edison's own third-party FAQ
  note: >-
    State-level regulatory supervision of a voluntary standard. The United States has no federal
    energy consumer data right, and no accreditation body sits between Con Edison and a third party —
    access is a bilateral agreement (Data Security Agreement), not CDR-style accreditation.
