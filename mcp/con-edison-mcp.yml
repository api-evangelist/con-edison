notes:
- 'The four Batch tools and three RealTime Batch tools are asynchronous: they return HTTP 202 and the
  result arrives as a notification POST to the third party (see asyncapi/con-edison-batch-notification-webhooks.yml).
  An MCP server would need to model them as long-running jobs, not request/response tools.'
- The token tool is an OAuth mechanism rather than a data tool and would normally live in the server transport
  layer, not the tool list.
- Real-time tools return provisional, non-billing-quality electric data for the last 24 hours only.
