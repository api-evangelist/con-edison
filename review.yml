actions:
  apisYmlUpdated: true
  openapiDirCreated: true
  collectionsDirCreated: true
  reason: >-
    Two APIs are listed and both are real. The Green Button Connect My Data API
    is backed by a verbatim-saved Swagger 2.0 definition and Postman collection
    and environment published by Con Edison itself, and by a live 401 from the
    documented production base URI. The Hosting Capacity Map REST API is listed
    because Con Edison documents REST access in its own words and the backing
    ArcGIS feature services return HTTP 200 anonymously. Nothing was invented:
    the Swagger declares no securityDefinitions, so the auth scheme is recorded
    in review.yml from prose and the Postman collection rather than being
    written into the spec, and the spec was saved exactly as fetched with no
    conversion to OpenAPI 3. Green Button Alliance certification is NOT claimed
    because no primary GBA source could be found. No outage feed, no EDI
    endpoint and no NYISO or EIA data were attributed to Con Edison.
