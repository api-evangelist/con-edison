findings:
  summary: >-
    Con Edison is the strongest United States counter-example to the assumption
    that an unmandated utility publishes nothing. No federal energy consumer
    data right exists; under New York PSC supervision — a DSIP commitment in
    Case 16-M-0411, the Data Access Framework in Case 20-M-0082, and a Customer
    Data Access Tariff — Con Edison built and runs a real Green Button Connect
    My Data implementation. It was verified, not taken on trust: the documented
    production base URI https://api.coned.com/gbc/espi/1_1 answers anonymously
    with HTTP 401 and an OAuth error body, a 37-path Swagger 2.0 contract for
    that exact base path is published and parses, a Postman collection named
    for the Green Button CMD v3.3 certification suite is published alongside
    it, and a 35-page onboarding document revised 2026-05-07 documents the
    OAuth flows, ESPI functional-block scopes, token lifetimes, batch
    semantics, rate limits and data latency. What could not be verified is
    Green Button Alliance certification from a primary GBA source — the
    certification page publishes no directory and lists Con Edison only as a
    sponsor. The access gate is heavy and unambiguous: registration, a signed
    Data Security Agreement, a technical onboarding form, 30 to 60 days of
    supervised certification testing, and Con Edison's flat statement that it
    "is unable to support API development for third parties." The split is the
    story — the same company serves its distribution-grid hosting capacity, EV
    transformer headroom, non-wires-solutions networks and 33kV feeder data to
    anyone over anonymous ArcGIS REST with no key and no agreement, while a
    single customer interval reading requires a signed contract and per-customer
    OAuth consent.
  apisListed: 2
  developerPortal: https://www.coned.com/en/accounts-billing/share-energy-usage-data/become-a-third-party
  portalConfirmed: true
  portalConfirmedCaveat: >-
    Live HTTP 200, public, developer-facing, and it serves real machine-readable
    artifacts (Swagger + Postman) to anonymous visitors. It is NOT self-serve —
    no keys are issued from it. That is recorded separately as
    accessGate: application-approval.
  openapiHarvested: true
  specsCount: 1
  gated: true
  contrast: >-
    Against BC Hydro, profiled the same day: BC Hydro is unmandated and closed
    on both axes — Green Button as a file download behind a customer login, no
    base URI, no spec, no open grid data. Con Edison is equally unmandated in
    the statutory sense and open on both axes in different ways: a live,
    contract-backed consumer API behind a heavy contractual gate, and genuinely
    anonymous grid data. Against an Ontario distributor compelled by Regulation
    633/21, Con Edison shows that state-regulator supervision plus a utility's
    own AMI business case can produce a deeper implementation — real-time
    endpoints beyond GBC v3.3, bulk client-credentials access, batch
    notification — than a bare compliance mandate typically does.

