api: Con Edison Green Button Connect My Data API
self_serve: false
summary: >-
  Con Edison runs a full, separately-addressed test environment for Green Button Connect My Data, and
  it is a mandatory stage of onboarding rather than an optional playground. Both the test API host and
  the test authorization host are live and OAuth-guarded (HTTP 401 anonymously, probed 2026-07-27).
  Access is supervised: the FAQ and onboarding document state that third parties cannot drive the GBC
  test environment on their own — the Con Edison onboarding team issues test credentials and reviews a
  completed API testing checklist before production registration is allowed. There are no public test
  credentials, no magic test identifiers and no self-issued sandbox keys.
environments:
- name: test
  api_base_url: https://apit.coned.com/gbc/espi/1_1
  token_endpoint: https://apit.coned.com/gbc/espi/1_1/oauth/token
  authorization_base:
    con_edison: https://uat10.coned.com/en/
    orange_rockland: https://uat10.oru.com/en/
  probed: 'GET https://apit.coned.com/gbc/espi/1_1/resource/ReadServiceStatus -> HTTP 401 (2026-07-27)'
- name: production
  api_base_url: https://api.coned.com/gbc/espi/1_1
  token_endpoint: https://api.coned.com/gbc/espi/1_1/oauth/Token
  authorization_base:
    con_edison: https://www.coned.com/en/
    orange_rockland: https://www.oru.com/en/
  probed: 'GET https://api.coned.com/gbc/espi/1_1/resource/ReadServiceStatus -> HTTP 401 (2026-07-27)'
  note: '"We will not be doing any customer authorization testing in production."'
