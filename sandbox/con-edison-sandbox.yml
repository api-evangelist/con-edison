  file: openapi/con-edison-green-button-connect-my-data-swagger.json
  source: https://edge-e-dcx-downloads-prod-gjf6ega8bmh8crfh.a01.azurefd.net/gbc-api-defintions/swagger-cert.json
  note: >-
    Con Edison's onboarding document points third parties at editor.swagger.io to render it. The
    document host placeholder is "provided-by-coned" — substitute apit.coned.com or api.coned.com.
- name: Endpoint checklist (API testing checklist)
  availability: emailed in the technical onboarding welcome package; not published publicly
credentials:
  issued_by: Con Edison GBC technical onboarding team, by email
  items: [client_id, client_secret, Registration Access Token]
  published_test_values: none
  note: No test cards, magic identifiers, seeded customers or public demo tokens are published.
test_process:
- Third-party registration in the test environment (technical registration form)
- Customer authorization flow testing — both third-party-initiated and utility-initiated
- GBC API testing against the Swagger definition and Postman collection
- Submit the completed API testing status to the onboarding team for review
- Re-register with production details
constraints:
  independent_access: false
  verbatim: '"third-party vendors cannot access the GBC test environment" independently — the onboarding team drives it'
  window_days: 90 to complete registration testing before the registration is put on hold
  support: dlsharemydatatech@coned.com
open_surface_alternative:
