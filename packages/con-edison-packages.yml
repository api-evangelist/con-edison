  official: false
  description: >-
    Community Python client that reads the latest smart-meter read (start time, end time, usage value,
    unit of measurement) for a Con Edison or Orange & Rockland account. It is NOT a Green Button
    Connect My Data client — it authenticates as the CUSTOMER with coned.com/oru.com credentials plus
    MFA (security question or TOTP) and an account UUID and meter number, the pattern used by the
    Home Assistant integration. It does not touch the ESPI API, uses no OAuth 2.0 third-party
    credentials, and is not endorsed by Con Edison.
  caution: Credential-based screen access, not the sanctioned third-party data path. Con Edison's supported machine-to-machine surface is Green Button Connect My Data under a signed Data Security Agreement.
