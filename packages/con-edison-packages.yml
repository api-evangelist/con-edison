summary: >-
  Con Edison ships NO first-party client libraries in any language, and there is no Con Edison GitHub
  organization to host them (api.github.com/orgs/coned returns 404; github.com/coned is an unrelated
  personal user account). This is consistent with its own position — "con Edison is unable to support
  API development for third parties. They must have their own technical team for the full setup." The
  only tooling Con Edison publishes is the Swagger 2.0 definition and the Postman collection and
  environment, all captured in this repo. What exists on the registries is community work, recorded
  here as such.
